<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MTG Cards</title>
<meta name="theme-color" content="#0d1015">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1015'/%3E%3Crect x='9' y='5' width='14' height='20' rx='2' fill='none' stroke='%23ebe8e1' stroke-width='2'/%3E%3Cpath d='M12 27h10' stroke='%23d8ad55' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* One-screen chat with the mtg-cards agent, in MTG: The Judge's night-table look: header, scrolling thread, composer pinned at the bottom.
   Answers are Markdown with card images laid out like cards on a table. */
:root{
  --bg:#0d1015; --surface:#161c24; --surface-2:#1b222c; --sunk:#10151b; --ink:#ebe8e1; --muted:#9ba4ae; --line:#26303b;
  --accent:#5cc8bf; --accent-ink:#06211e; --brass:#d8ad55; --you:#17302e; --bad:#e0664f; --shadow:0 14px 34px rgba(0,0,0,.45);
  --display:"Alegreya SC","Palatino Linotype",Georgia,serif; --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef0ec; --surface:#ffffff; --surface-2:#f7f8f5; --sunk:#f2f4f0; --ink:#1a1e23; --muted:#56606a; --line:#d6dbd5;
  --accent:#0d6e6a; --accent-ink:#ffffff; --brass:#8a6416; --you:#e1efed; --bad:#b33a22; --shadow:0 10px 24px rgba(20,30,40,.16); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#eef0ec; --surface:#ffffff; --surface-2:#f7f8f5; --sunk:#f2f4f0; --ink:#1a1e23; --muted:#56606a; --line:#d6dbd5;
  --accent:#0d6e6a; --accent-ink:#ffffff; --brass:#8a6416; --you:#e1efed; --bad:#b33a22; --shadow:0 10px 24px rgba(20,30,40,.16); color-scheme:light }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);display:flex;flex-direction:column}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
header .in,.thread,.composer .in{max-width:880px;margin:0 auto;width:100%}
header .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--display);letter-spacing:.02em}
.brand svg{width:28px;height:28px}
.brand small{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
header .links{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{font:500 15px var(--body);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{font-size:14px;padding:5px 12px}
.btn:disabled{opacity:.5;cursor:default}
.scroll{flex:1;overflow-y:auto;padding:20px 16px}
.thread{display:grid;gap:22px}
.intro{display:grid;gap:12px}
.intro h1{font:800 clamp(28px,5vw,40px)/1.08 var(--display);margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:62ch}
.examples{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.label{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.msg.you{justify-self:end;max-width:min(80%,620px);background:var(--you);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:9px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.agent{min-width:0;display:grid;gap:6px}
.answer{min-width:0;overflow-wrap:anywhere}
.answer>*:first-child{margin-top:0}
.answer h1,.answer h2,.answer h3{font:700 21px/1.25 var(--display);margin:18px 0 6px;letter-spacing:.02em;text-wrap:balance}
.answer h1{font-size:25px}
.answer p,.answer li{max-width:72ch}
.answer blockquote{margin:8px 0;padding:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-style:normal}
.answer blockquote p{margin:0}
.answer code{font:14px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.answer pre{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.answer .tw{overflow-x:auto;margin:10px 0}
.answer table{border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.answer th,.answer td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.answer th{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.answer img.card{width:min(250px,100%);aspect-ratio:488/680;border-radius:4.75%/3.5%;box-shadow:var(--shadow);background:var(--sunk);vertical-align:top;margin:4px 10px 4px 0;cursor:zoom-in;transition:transform .15s ease}
.answer img.card:hover{transform:translateY(-3px)}
.answer p:has(> img.card + img.card) img.card{width:min(190px,46%)}
img.ms{width:1.05em;height:1.05em;vertical-align:-.16em;margin:0 1px}
.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--brass);animation:pulse 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.8}.answer img.card{transition:none}}
.steps{font:500 12px var(--mono);color:var(--muted)}
.err{color:var(--bad)}
.composer{border-top:1px solid var(--line);background:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.composer form{display:flex;gap:8px;align-items:end}
.composer textarea{flex:1;min-width:0;font:inherit;resize:none;max-height:160px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.composer .hint{margin-top:6px;font-size:13px;color:var(--muted)}
#zoom{position:fixed;inset:0;background:rgba(5,8,12,.82);display:grid;place-items:center;padding:20px;z-index:10;cursor:zoom-out}
#zoom img{max-height:90vh;max-width:100%;border-radius:4.75%/3.5%;box-shadow:var(--shadow)}
@media (max-width:560px){ .msg.you{max-width:92%} .brand{font-size:19px} }
</style>
</head>
<body>
<header>
  <div class="in">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="8" y="4" width="16" height="22" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 10h8M12 14h8M12 18h5" stroke="var(--brass)" stroke-width="1.6" stroke-linecap="round"/><path d="M11 29h10" stroke="var(--brass)" stroke-width="2" stroke-linecap="round"/></svg><span>MTG Cards</span><small>Card librarian</small></div>
    <div class="links">
      <a class="btn ghost small" href="https://robbieagassociates.github.io/mtg-judge/cards/" target="_blank" rel="noopener">Card Index ↗</a>
      <button class="btn ghost small" id="newchat" type="button">New chat</button>
    </div>
  </div>
</header>
<div class="scroll" id="scroll">
  <div class="thread" id="thread"></div>
</div>
<div class="composer">
  <div class="in">
    <form id="form">
      <textarea id="q" rows="1" placeholder="Ask about any Magic card, printing, set or artist…" aria-label="Your question"></textarea>
      <button class="btn" id="send" type="submit">Ask</button>
    </form>
    <div class="hint" id="hint">Enter to send, Shift+Enter for a new line. Answers come from the mtg-cards agent running on this Mac.</div>
  </div>
</div>
<div id="zoom" hidden><img alt=""></div>

<script>
const EXAMPLES = [
  "Show me Sol Ring and every printing's price range",
  "Analyze Cultivate for Commander",
  "Compare Counterspell, Mana Drain and Arcane Denial",
  "Best budget white board wipes for Commander, with images",
  "What cards did Rebecca Guay illustrate?",
  "Show me the double-faced card Delver of Secrets, both sides"
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = {turns: [], session: null, busy: null};
try { const s = JSON.parse(localStorage.getItem("mtgcards.chat") || "null"); if (s && Array.isArray(s.turns)) Object.assign(state, {turns: s.turns.slice(-30), session: s.session || null}); } catch (e) {}
function save(){ try { localStorage.setItem("mtgcards.chat", JSON.stringify({turns: state.turns, session: state.session})); } catch (e) {} }

let SYM = {};
fetch("/symbols.json").then(r => r.ok ? r.json() : {}).then(j => { SYM = j; document.querySelectorAll(".answer").forEach(addSymbols); }).catch(() => {});

/* Markdown -> safe HTML, then card images, mana symbols and outside links */
function renderMarkdown(md){
  const html = window.marked ? marked.parse(md, {gfm: true, breaks: false}) : `<p>${esc(md).replace(/\n/g, "<br>")}</p>`;
  const div = document.createElement("div");
  div.className = "answer";
  // build inside an inert <template> so images don't start loading until their attributes are final
  const tpl = document.createElement("template");
  tpl.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
  tpl.content.querySelectorAll("img").forEach(img => {
    const src = img.getAttribute("src") || "";
    if (/^https:\/\/cards\.scryfall\.io\//.test(src)){ img.classList.add("card"); img.setAttribute("src", src.replace(/\/(small|large|png)\//, "/normal/")); }
    img.setAttribute("decoding", "async");
  });
  div.appendChild(document.importNode(tpl.content, true));
  div.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tw"; t.replaceWith(w); w.appendChild(t); });
  div.querySelectorAll("a[href]").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  div.querySelectorAll("img").forEach(img => {
    img.addEventListener("click", () => openZoom(img));
    // an image wrapped in a link opens the zoom instead of leaving the page
    if (img.parentElement.tagName === "A" && img.classList.contains("card")) img.parentElement.addEventListener("click", e => e.preventDefault());
  });
  addSymbols(div);
  return div;
}
function addSymbols(root){
  if (!Object.keys(SYM).length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest("code,pre") || !/\{[^}]+\}/.test(n.nodeValue) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes){
    const span = document.createElement("span");
    span.innerHTML = esc(n.nodeValue).replace(/\{([^}]+)\}/g, (m, s) => SYM[s] ? `<img class="ms" src="/${SYM[s]}" alt="{${esc(s)}}" title="{${esc(s)}}">` : m);
    n.replaceWith(...span.childNodes);
  }
}
function openZoom(img){
  const z = $("#zoom"); z.querySelector("img").src = img.src.replace("/normal/", "/large/"); z.querySelector("img").alt = img.alt; z.hidden = false;
}
$("#zoom").onclick = () => { $("#zoom").hidden = true; };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#zoom").hidden = true; });

/* thread */
function introEl(){
  const d = document.createElement("section"); d.className = "intro";
  d.innerHTML = `<span class="label">Every card · every printing · every set</span><h1>Ask the card librarian</h1>
    <p>Find, see, read and analyze any Magic: The Gathering card. The agent searches the saved card data (about 35,000 cards and 112,000 printings) and Scryfall, and shows card images in its answers.</p>
    <div class="examples">${EXAMPLES.map(x => `<button class="chip" type="button">${esc(x)}</button>`).join("")}</div>
    <p class="steps" id="datainfo"></p>`;
  d.querySelectorAll(".chip").forEach(b => b.onclick = () => ask(b.textContent));
  fetch("/api/info").then(r => r.json()).then(j => { const el = d.querySelector("#datainfo"); if (el) el.textContent = j.claude ? j.data.replace(/\n/g, " ") : "Claude Code isn't installed on this Mac, so the agent can't run. Install Claude Code, then restart the app."; }).catch(() => {});
  return d;
}
function render(){
  const t = $("#thread"); t.innerHTML = "";
  if (!state.turns.length) t.appendChild(introEl());
  for (const turn of state.turns) t.appendChild(turnEl(turn));
}
function turnEl(turn){
  const frag = document.createDocumentFragment();
  const you = document.createElement("div"); you.className = "msg you"; you.textContent = turn.q; frag.appendChild(you);
  const a = document.createElement("div"); a.className = "msg agent";
  if (turn.answer) a.appendChild(renderMarkdown(turn.answer));
  if (turn.error) a.insertAdjacentHTML("beforeend", `<p class="err">${esc(turn.error)}</p>`);
  if (turn.meta) a.insertAdjacentHTML("beforeend", `<span class="steps">${esc(turn.meta)}</span>`);
  frag.appendChild(a);
  return frag;
}
function scrollDown(){ const s = $("#scroll"); s.scrollTop = s.scrollHeight; }

async function ask(text){
  const q = String(text || "").trim();
  if (!q || state.busy) return;
  $("#q").value = ""; grow();
  if (!state.turns.length) $("#thread").innerHTML = "";
  const turn = {q, answer: "", error: "", meta: ""};
  state.turns.push(turn);
  $("#thread").appendChild(turnEl(turn));
  const box = $("#thread").lastElementChild;
  box.innerHTML = `<div class="status"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="stat">Thinking</span><button class="btn ghost small" id="stop" type="button">Stop</button></div><div class="steps" id="steplog"></div>`;
  scrollDown();
  const ctrl = new AbortController(); state.busy = ctrl;
  $("#send").disabled = true;
  $("#stop").onclick = () => ctrl.abort();
  const steps = []; let partial = "";
  try {
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question: q, session: state.session}), signal: ctrl.signal});
    if (!r.ok){ let m = "The app couldn't reach the agent (" + r.status + ")."; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;){
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i; while ((i = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line.trim()) continue;
        const e = JSON.parse(line);
        if (e.type === "status"){ const st = $("#stat"); if (st) st.textContent = e.text; if (e.text !== "Thinking" && steps[steps.length - 1] !== e.text) steps.push(e.text); const sl = $("#steplog"); if (sl) sl.textContent = steps.join(" · "); }
        else if (e.type === "text"){ partial = e.text; }
        else if (e.type === "done"){ turn.answer = e.answer || partial; state.session = e.session || state.session; turn.meta = `${steps.length} lookup${steps.length === 1 ? "" : "s"} · ${e.seconds}s`; }
        else if (e.type === "error"){ turn.error = e.text; turn.answer = partial; if (e.session) state.session = e.session; }
      }
    }
    if (!turn.answer && !turn.error) turn.error = "The agent didn't send an answer. Try again.";
  } catch (e){
    turn.answer = turn.answer || partial;
    turn.error = e.name === "AbortError" ? "Stopped." : (e.message === "Failed to fetch" ? "The app's server isn't running. Start it again with python3 server.py." : e.message);
  } finally {
    state.busy = null; $("#send").disabled = false;
    box.replaceWith(turnEl(turn).lastElementChild);
    save(); scrollDown();
  }
}

/* composer */
function grow(){ const t = $("#q"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
$("#q").addEventListener("input", grow);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); ask($("#q").value); } });
$("#form").onsubmit = e => { e.preventDefault(); ask($("#q").value); };
$("#newchat").onclick = () => { if (state.busy) state.busy.abort(); state.turns = []; state.session = null; save(); render(); $("#q").focus(); };
render(); scrollDown();
</script>
</body></html>
